<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande confirmée | Artaluz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/config.js"></script>
</head>
<body>
<main class="wrap" style="padding:64px 16px;max-width:680px">
  <h1>Merci pour votre commande</h1>
  <p class="lead muted" id="msg" style="margin-top:16px">Nous confirmons votre paiement…</p>
  <a class="btn ghost" href="/">Retour à l'accueil</a>
</main>
<script type="module">
import { chrome, api, esc, cart } from '/assets/app.js';
chrome();
const n = new URLSearchParams(location.search).get('n');
const msg = document.getElementById('msg');
let tries = 0;
async function check() {
  try {
    const o = await api(`/api/orders/${encodeURIComponent(n)}`);
    if (o.status === 'pending' && tries++ < 10) return setTimeout(check, 2000);
    if (o.status !== 'pending') cart.write([]);
    msg.innerHTML = o.status === 'pending'
      ? `Votre commande <b>${esc(n)}</b> est enregistrée. La confirmation de paiement arrive par email dans quelques minutes.`
      : `Votre commande <b>${esc(n)}</b> est confirmée. Un email récapitulatif vient de vous être envoyé ; nous l'imprimons dans notre atelier et vous prévenons à l'expédition.`;
  } catch { msg.textContent = 'Commande introuvable. Si vous avez été débité, écrivez-nous à contact@artaluz.com.'; }
}
n ? check() : (msg.textContent = 'Aucune commande indiquée.');
</script>
</body>
</html>
